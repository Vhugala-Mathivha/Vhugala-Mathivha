<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Certifications: AWS Cloud Foundations 2026, Oracle Cloud DevOps Professional 2025, Python for Everybody 2025, SheCodes Advanced Web Development 2025, SheCodes Artificial Intelligence 2025">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1424"/>
      <stop offset="1" stop-color="#1A0E1A"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8C8DC"/>
      <stop offset="1" stop-color="#E75480"/>
    </linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#E75480" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFD6E7" stop-opacity="1"/>
      <stop offset="1" stop-color="#E75480" stop-opacity="0.35"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="570 0" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#E75480" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#E75480" stop-opacity="0"/>
    </radialGradient>
    <path id="spark" d="M0,-7 C1,-1 1,-1 7,0 C1,1 1,1 0,7 C-1,1 -1,1 -7,0 C-1,-1 -1,-1 0,-7Z"/>
  </defs>

  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .card { animation: rise 0.9s cubic-bezier(.2,.8,.2,1) both; }
    .c2 { animation-delay: .15s } .c3 { animation-delay: .3s }
    .c4 { animation-delay: .45s } .c5 { animation-delay: .6s }
    .mono { font-size: 12px; font-weight: 800; fill: #fff; letter-spacing: .5px; }
    .cat { font-size: 10px; font-weight: 700; fill: #F8A5C2; letter-spacing: 2.5px; }
    .title { font-size: 16px; font-weight: 700; fill: #FFF0F6; }
    .issuer { font-size: 12px; fill: #C99AAF; }
    .year { font-size: 11px; font-weight: 700; fill: #FFD6E7; }
    .twinkle { animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
  </style>

  <!-- Card template: 270 x 130 -->
  <!-- 1. AWS -->
  <g transform="translate(15,10)"><g class="card">
    <rect width="270" height="130" rx="16" fill="url(#cardBg)"/>
    <rect width="270" height="130" rx="16" fill="url(#glow)"/>
    <rect x=".75" y=".75" width="268.5" height="128.5" rx="16" fill="none" stroke="#E75480" stroke-opacity=".45" stroke-width="1.5"/>
    <rect x=".75" y=".75" width="268.5" height="128.5" rx="16" fill="none" stroke="url(#shine)" stroke-width="1.5"/>
    <circle cx="38" cy="38" r="22" fill="url(#rose)"/>
    <text x="38" y="42" text-anchor="middle" class="mono">AWS</text>
    <text x="70" y="42" class="cat">CLOUD</text>
    <rect x="200" y="26" width="54" height="24" rx="12" fill="#E75480" fill-opacity=".18" stroke="#E75480"/>
    <text x="227" y="42" text-anchor="middle" class="year">2026</text>
    <text x="18" y="88" class="title">Cloud Foundations</text>
    <text x="18" y="110" class="issuer">Amazon Web Services</text>
    <use href="#spark" x="248" y="108" fill="#F8C8DC" class="twinkle"/>
  </g></g>

  <!-- 2. Oracle -->
  <g transform="translate(305,10)"><g class="card c2">
    <rect width="270" height="130" rx="16" fill="url(#cardBg)"/>
    <rect width="270" height="130" rx="16" fill="url(#glow)"/>
    <rect x=".75" y=".75" width="268.5" height="128.5" rx="16" fill="none" stroke="#E75480" stroke-opacity=".45" stroke-width="1.5"/>
    <rect x=".75" y=".75" width="268.5" height="128.5" rx="16" fill="none" stroke="url(#shine)" stroke-width="1.5"/>
    <circle cx="38" cy="38" r="22" fill="url(#rose)"/>
    <text x="38" y="42" text-anchor="middle" class="mono">OCI</text>
    <text x="70" y="42" class="cat">DEVOPS</text>
    <rect x="200" y="26" width="54" height="24" rx="12" fill="#E75480" fill-opacity=".18" stroke="#E75480"/>
    <text x="227" y="42" text-anchor="middle" class="year">2025</text>
    <text x="18" y="88" class="title">Cloud DevOps Professional</text>
    <text x="18" y="110" class="issuer">Oracle University</text>
    <use href="#spark" x="248" y="108" fill="#F8C8DC" class="twinkle" style="animation-delay:.6s"/>
  </g></g>

  <!-- 3. Python -->
  <g transform="translate(595,10)"><g class="card c3">
    <rect width="270" height="130" rx="16" fill="url(#cardBg)"/>
    <rect width="270" height="130" rx="16" fill="url(#glow)"/>
    <rect x=".75" y=".75" width="268.5" height="128.5" rx="16" fill="none" stroke="#E75480" stroke-opacity=".45" stroke-width="1.5"/>
    <rect x=".75" y=".75" width="268.5" height="128.5" rx="16" fill="none" stroke="url(#shine)" stroke-width="1.5"/>
    <circle cx="38" cy="38" r="22" fill="url(#rose)"/>
    <text x="38" y="42" text-anchor="middle" class="mono">PY</text>
    <text x="70" y="42" class="cat">PROGRAMMING</text>
    <rect x="200" y="26" width="54" height="24" rx="12" fill="#E75480" fill-opacity=".18" stroke="#E75480"/>
    <text x="227" y="42" text-anchor="middle" class="year">2025</text>
    <text x="18" y="88" class="title">Python for Everybody</text>
    <text x="18" y="110" class="issuer">University of Michigan · Coursera</text>
    <use href="#spark" x="248" y="108" fill="#F8C8DC" class="twinkle" style="animation-delay:1.2s"/>
  </g></g>

  <!-- 4. SheCodes Web -->
  <g transform="translate(160,160)"><g class="card c4">
    <rect width="270" height="130" rx="16" fill="url(#cardBg)"/>
    <rect width="270" height="130" rx="16" fill="url(#glow)"/>
    <rect x=".75" y=".75" width="268.5" height="128.5" rx="16" fill="none" stroke="#E75480" stroke-opacity=".45" stroke-width="1.5"/>
    <rect x=".75" y=".75" width="268.5" height="128.5" rx="16" fill="none" stroke="url(#shine)" stroke-width="1.5"/>
    <circle cx="38" cy="38" r="22" fill="url(#rose)"/>
    <text x="38" y="42" text-anchor="middle" class="mono">SC</text>
    <text x="70" y="42" class="cat">WEB DEV</text>
    <rect x="200" y="26" width="54" height="24" rx="12" fill="#E75480" fill-opacity=".18" stroke="#E75480"/>
    <text x="227" y="42" text-anchor="middle" class="year">2025</text>
    <text x="18" y="88" class="title">Advanced Web Development</text>
    <text x="18" y="110" class="issuer">SheCodes</text>
    <use href="#spark" x="248" y="108" fill="#F8C8DC" class="twinkle" style="animation-delay:.3s"/>
  </g></g>

  <!-- 5. SheCodes AI -->
  <g transform="translate(450,160)"><g class="card c5">
    <rect width="270" height="130" rx="16" fill="url(#cardBg)"/>
    <rect width="270" height="130" rx="16" fill="url(#glow)"/>
    <rect x=".75" y=".75" width="268.5" height="128.5" rx="16" fill="none" stroke="#E75480" stroke-opacity=".45" stroke-width="1.5"/>
    <rect x=".75" y=".75" width="268.5" height="128.5" rx="16" fill="none" stroke="url(#shine)" stroke-width="1.5"/>
    <circle cx="38" cy="38" r="22" fill="url(#rose)"/>
    <text x="38" y="42" text-anchor="middle" class="mono">AI</text>
    <text x="70" y="42" class="cat">EMERGING TECH</text>
    <rect x="200" y="26" width="54" height="24" rx="12" fill="#E75480" fill-opacity=".18" stroke="#E75480"/>
    <text x="227" y="42" text-anchor="middle" class="year">2025</text>
    <text x="18" y="88" class="title">Artificial Intelligence</text>
    <text x="18" y="110" class="issuer">SheCodes</text>
    <use href="#spark" x="248" y="108" fill="#F8C8DC" class="twinkle" style="animation-delay:.9s"/>
  </g></g>
</svg>
