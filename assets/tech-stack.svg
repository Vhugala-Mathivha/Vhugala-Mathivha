<radialGradient id="glow" cx="0.1" cy="0.1" r="0.7"><stop offset="0" stop-color="#E75480" stop-opacity="0.25"/><stop offset="1" stop-color="#E75480" stop-opacity="0"/></radialGradient>
<linearGradient id="rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8C8DC"/><stop offset="1" stop-color="#E75480"/></linearGradient>
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
<stop offset="0" stop-color="#E75480" stop-opacity="0"/><stop offset="0.5" stop-color="#FFD6E7" stop-opacity="1"/><stop offset="1" stop-color="#E75480" stop-opacity="0"/>
