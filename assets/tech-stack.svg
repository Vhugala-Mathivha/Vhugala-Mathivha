<style>
text{font-family:"Segoe UI",-apple-system,Helvetica,Arial,sans-serif}
.card{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.chip{animation:pop .5s ease-out both}
.label{font-size:11px;font-weight:700;fill:#F8A5C2;letter-spacing:2.5px}
.count{font-size:11px;font-weight:700;fill:#8E6577;letter-spacing:1px}
.t{font-size:13px;font-weight:600;fill:#FFE4EE}
.dot{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.75)}50%{opacity:1;transform:scale(1.15)}}
</style>
